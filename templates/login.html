<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 乳愈智能</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-wrap">
    <form class="login-card" method="post" action="{{ url_for('login') }}">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="15.1" stroke="currentColor" stroke-width="1" opacity=".25"/>
            <circle cx="20" cy="20" r="12.6" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="butt" stroke-dasharray="61.6 17.6" transform="rotate(355 20 20)"/>
            <circle cx="20" cy="20" r="3.3" fill="currentColor"/>
            <circle cx="28.9" cy="11.1" r="2" fill="#A9812F"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>乳愈智能</strong>
          <small>Breast Cancer AI · RAG</small>
        </span>
      </div>

      <h1 class="login-title">登录系统</h1>
      <p class="muted login-sub">乳腺癌 AI 预测系统 · 专业实习 2 期末大作业</p>

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <input type="hidden" name="next" value="{{ next }}">

      <label class="field">
        <span class="field-label">账号</span>
        <input type="text" name="username" value="{{ username }}" placeholder="请输入账号"
               autocomplete="username" autofocus required>
      </label>

      <label class="field">
        <span class="field-label">口令</span>
        <input type="password" name="password" placeholder="请输入口令"
               autocomplete="current-password" required>
      </label>

      <button type="submit" class="btn btn-primary btn-lg login-submit">登 录</button>

      <p class="login-hint">
        管理员：<code>admin</code> / <code>admin123</code>（可进入系统设置）<br>
        普通用户：<code>user</code> / <code>1234</code>（仅预测、问答与知识库）
      </p>
    </form>
  </div>
</body>
</html>

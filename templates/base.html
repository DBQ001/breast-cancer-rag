<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}乳愈智能 · 乳腺癌 AI 预测系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
  </div>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">乳</span>
        <span class="brand-text">
          <strong>乳愈智能</strong>
          <small>Breast Cancer AI · RAG</small>
        </span>
      </a>
      <nav class="nav">
        <a href="/" class="nav-link {{ 'is-active' if active == 'predict' }}">AI 预测</a>
        <a href="/assistant" class="nav-link {{ 'is-active' if active == 'assistant' }}">智能问答</a>
        <a href="/knowledge" class="nav-link {{ 'is-active' if active == 'knowledge' }}">医学知识库</a>
        <a href="/api/health" class="nav-link" target="_blank" rel="noopener">服务状态</a>
        <span class="nav-sep" aria-hidden="true"></span>
        <span class="nav-user" title="当前登录账号">{{ username or '未登录' }}</span>
        <a href="/logout" class="nav-link nav-logout">退出</a>
      </nav>
    </div>
  </header>

  <main class="shell page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>乳愈智能 · 乳腺癌 AI 预测系统 —— 专业实习 2 期末大作业</p>
      <p class="muted">
        前后端：Flask + Jinja2 · 算法：逻辑回归 / 随机森林 · RAG：本地知识库混合检索
      </p>
      <p class="disclaimer">
        本系统为教学演示原型，所有预测与解读结果仅供健康科普与教学参考，不能替代医生诊断。
      </p>
    </div>
  </footer>

  <a class="settings-fab" href="/settings" title="系统设置" aria-label="系统设置">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </a>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
